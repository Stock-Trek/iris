name: "Question pi"
description: "Ask a question of pi providing a validated response according to the json schema"
inputs:
  context-base64:
    description: "Context to send to pi in base64"
    required: true
  prompt-base64:
    description: "Prompt to send to pi in base64"
    required: true
  schema-base64:
    description: "Json schema to validate the response with in base64"
    required: true
  provider:
    description: "Provider to use for pi"
    required: false
    default: deepseek
  model:
    description: "Model to use for pi"
    required: false
    default: deepseek-v4-flash
outputs:
  response-base64:
    description: "Response json formatted in schema in base64"
    value: ${{ steps.pi-response.outputs.pi-response-base64 }}
runs:
  using: "composite"
  steps:
    - shell: bash
      id: pi-response
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
      run: |
        CONTEXT=$(echo "${{ inputs.context-base64 }}" | base64 -d)
        PROMPT=$(echo "${{ inputs.prompt-base64 }}" | base64 -d)
        SCHEMA=$(echo "${{ inputs.schema-base64 }}" | base64 -d)
        echo "${PROMPT}"
        echo "${SCHEMA}"
        echo "provider: ${PROVIDER}"
        echo "model: ${MODEL}"
        MESSAGE=$(printf '%s\n\n%s\n%s\n%s\n\n%s' "${PROMPT}" "<Start of context>" "${CONTEXT}" "<End of context>" "FINAL INSTRUCTION: You MUST call the json_output tool with the JSON object as the 'data' argument. Do NOT output any other text.")
        JSON_OUTPUT_FILE=$(mktemp)
        set +e
        PI_RESPONSE=$(pi \
          --provider "${PROVIDER}" \
          --model "${MODEL}" \
          --tools read,bash,grep,find,ls,json_output \
          --json-schema "${SCHEMA}" \
          --json-fallback force \
          --json-output "${JSON_OUTPUT_FILE}" \
          --print "${MESSAGE}" \
          )
        PI_EXIT=$?
        set -e
        echo "${PI_RESPONSE}"
        if [ ${PI_EXIT} -ne 0 ] || [ ! -s "${JSON_OUTPUT_FILE}" ]; then
          echo "Error: pi exited with code ${PI_EXIT} without writing a schema-validated JSON output to ${JSON_OUTPUT_FILE}" >&2
          exit 1
        fi
        PI_RESPONSE_BASE64=$(base64 -w 0 < "${JSON_OUTPUT_FILE}")
        rm -f "${JSON_OUTPUT_FILE}"
        echo "pi-response-base64=${PI_RESPONSE_BASE64}" >> "$GITHUB_OUTPUT"
