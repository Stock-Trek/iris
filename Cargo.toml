[package]
name = "iris"
version = "1.0.3"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures = "0.3.32"
http = "1.4.1"
rand = "0.8"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = "0.26"
tokio-stream =  { version = "0.1.18", features = ["io-util"] }
tokio-websockets = { version = "0.13.2", features = ["client", "server", "fastrand", "ring", "rustls-webpki-roots", "rustls-bring-your-own-connector"] }
tracing = "0.1.44"
webpki-roots = "0.26"

[dev-dependencies]
ctor = "0.2"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = []
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]
